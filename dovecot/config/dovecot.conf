# Dovecot configuration for local development
dovecot_config_version = 2.4.0

# Basic settings
protocols = imap pop3
listen = *

# SSL disabled for development
ssl = no

# Authentication
auth_mechanisms = plain login

# Password database
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

# User database
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

# Mail plugin
mail_plugins = $mail_plugins

# Namespace
namespace inbox {
  type = private
  separator = /
  prefix = 
  location = 
  inbox = yes
}

# Protocol settings
protocol imap {
  mail_plugins = $mail_plugins
}

protocol pop3 {
  mail_plugins = $mail_plugins
  pop3_uidl_format = %08Xu%08Xv
}

# Services
service imap-login {
  inet_listener imap {
    port = 143
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
}
